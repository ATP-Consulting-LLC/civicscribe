<!doctype html>
<!--
  Source for public/og.png, the 1200x630 social link card (LinkedIn, X, Slack).
  Rendered by scripts/og-image/render.mjs. Copy comes from the home page hero;
  colours and the dome mark come from globals.css and layout.tsx.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;600;700&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; }
  body { width: 1200px; height: 630px; overflow: hidden; background: #0d1512; }
  .card {
    position: relative; width: 1200px; height: 630px; overflow: hidden;
    font-family: "Geist", ui-sans-serif, system-ui, sans-serif; color: #f4f7f5;
  }
  .photo {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; object-position: center 35%;
  }
  /* Same scrim as .home-hero__scrim, so the card reads like the live hero. */
  .scrim {
    position: absolute; inset: 0;
    background:
      linear-gradient(90deg, rgba(4,8,6,0.96) 0%, rgba(4,8,6,0.84) 48%, rgba(4,8,6,0.5) 80%, rgba(4,8,6,0.62) 100%),
      linear-gradient(180deg, rgba(4,8,6,0.55) 0%, rgba(4,8,6,0.35) 45%, rgba(6,11,9,0.95) 100%);
  }
  .inner {
    position: absolute; inset: 0; padding: 64px 80px 56px;
    display: flex; flex-direction: column;
  }
  .brand { display: flex; align-items: center; gap: 16px; font-size: 40px; font-weight: 700; letter-spacing: -0.01em; color: #fff; }
  .brand svg { width: 52px; height: 52px; stroke: #35c987; }
  .eyebrow {
    display: flex; align-items: center; gap: 16px; margin: auto 0 24px;
    font-size: 22px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: #35c987;
  }
  .eyebrow::before { content: ""; width: 48px; height: 4px; background: #35c987; }
  h1 { margin: 0 0 24px; font-size: 76px; line-height: 1.02; letter-spacing: -0.02em; font-weight: 650; color: #fff; max-width: 900px; }
  .lede { margin: 0; font-size: 30px; line-height: 1.4; color: #dbe4e0; max-width: 820px; }
  .foot { margin-top: 40px; display: flex; align-items: center; gap: 14px; font-size: 24px; font-weight: 600; color: #e8efec; }
  .foot::before { content: ""; width: 12px; height: 12px; border-radius: 50%; background: #35c987; }
</style>
</head>
<body>
  <div class="card">
    <img class="photo" src="../../public/hero/home-hero.jpg" alt="">
    <div class="scrim"></div>
    <div class="inner">
      <div class="brand">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 20h16" /><path d="M5 20v-7h14v7" /><path d="M7 13v7M12 13v7M17 13v7" />
          <path d="M5 13c0-3.9 3.1-7 7-7s7 3.1 7 7" /><path d="M12 6V3" />
        </svg>
        CivicScribe
      </div>
      <p class="eyebrow">For cities and towns</p>
      <h1>Find any word in any meeting.</h1>
      <p class="lede">We record your meetings. We turn them into text you can search and read.</p>
      <div class="foot">civicscribe.us</div>
    </div>
  </div>
</body>
</html>
